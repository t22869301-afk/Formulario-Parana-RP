<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário Staff - Paraná RP</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .form-container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            border: 2px solid #1e90ff;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 8px 24px rgba(30, 144, 255, 0.2);
        }

        .form-container h2 {
            text-align: center;
            color: #1e90ff;
            margin-bottom: 8px;
        }

        .form-container p {
            text-align: center;
            font-size: 13px;
            color: #aaa;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            margin-bottom: 5px;
            color: #ddd;
        }

        .input-group input, 
        .input-group textarea {
            width: 100%;
            padding: 10px;
            background-color: #2a2a2a;
            border: 1px solid #333;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        .input-group input:focus, 
        .input-group textarea:focus {
            border-color: #1e90ff;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #1e90ff;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-submit:hover {
            background-color: #0066cc;
        }

        #mensagemStatus {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Recrutamento Staff</h2>
        <p>Paraná RP — Requisito mínimo: +12 anos</p>

        <form id="staffForm">
            <div class="input-group">
                <label for="nickRoblox">Seu Nick no Roblox</label>
                <input type="text" id="nickRoblox" placeholder="Ex: Player123" required>
            </div>

            <div class="input-group">
                <label for="idade">Qual a sua idade?</label>
                <input type="number" id="idade" min="12" placeholder="Ex: 14" required>
            </div>

            <div class="input-group">
                <label for="discord">Seu Discord (Nome de Usuário)</label>
                <input type="text" id="discord" placeholder="Ex: usuario_dc" required>
            </div>

            <div class="input-group">
                <label for="tempo">Tempo disponível por dia</label>
                <input type="text" id="tempo" placeholder="Ex: 4 horas à tarde" required>
            </div>

            <div class="input-group">
                <label for="motivo">Por que você quer entrar para a equipe?</label>
                <textarea id="motivo" rows="4" placeholder="Escreva um breve motivo..." required></textarea>
            </div>

            <button type="submit" class="btn-submit">Enviar Inscrição</button>
            <div id="mensagemStatus"></div>
        </form>
    </div>

    <script>
        // COLE O URL DO SEU WEBHOOK DO DISCORD AQUI
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1535039251241242724/7WmmE0OFdyPGDp4zmUrB8R9np9y9POeZwRFPz9STQ8DV8e-9v6V4W1yP3ORO1w2_pZgf";

        document.getElementById('staffForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            const status = document.getElementById('mensagemStatus');
            const nickRoblox = document.getElementById('nickRoblox').value;
            const idade = parseInt(document.getElementById('idade').value);
            const discord = document.getElementById('discord').value;
            const tempo = document.getElementById('tempo').value;
            const motivo = document.getElementById('motivo').value;

            // Validação da idade mínima (+12 anos)
            if (idade < 12) {
                status.style.color = "#ff4c4c";
                status.innerText = "❌ É necessário ter no mínimo 12 anos para se candidatar.";
                return;
            }

            status.style.color = "#1e90ff";
            status.innerText = "⏳ Enviando formulário...";

            // Payload formatado para Embed no Discord
            const payload = {
                embeds: [{
                    title: "📋 Nova Candidatura para Staff",
                    color: 3066993, // Azul Neon
                    fields: [
                        { name: "👤 Nick Roblox", value: nickRoblox, inline: true },
                        { name: "🎂 Idade", value: idade + " anos", inline: true },
                        { name: "💬 Discord", value: discord, inline: true },
                        { name: "⏰ Tempo Disponível", value: tempo, inline: false },
                        { name: "📝 Motivo", value: motivo, inline: false },
                        { name: "✅ Status", value: "Aprovado no pré-requisito de idade (+12)", inline: false }
                    ],
                    footer: { text: "Paraná RP • Sistema de Inscrição" },
                    timestamp: new Date().toISOString()
                }]
            };

            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    status.style.color = "#4cff4c";
                    status.innerText = "✅ Formulário enviado com sucesso para o Discord!";
                    document.getElementById('staffForm').reset();
                } else {
                    throw new Error("Erro ao enviar");
                }
            } catch (error) {
                status.style.color = "#ff4c4c";
                status.innerText = "❌ Erro ao enviar formulário. Verifique o link do Webhook.";
            }
        });
    </script>
</body>
</html>
